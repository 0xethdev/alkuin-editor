[package]
name = "desktop"
version = "0.7.11"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = { version = "7", features = ["macos_fsevent"] }
fontdb = "0.23"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["fs", "sync"] }
parking_lot = "0.12"
thiserror = "2"
trash = "5"
base64 = "0.22"
tauri-plugin-store = "2.4.2"
tauri-plugin-updater = "2"
# Same minisign check the updater plugin runs before it will install.
minisign-verify = "0.2"
tauri-plugin-single-instance = "2"
tauri-plugin-webdriver = { version = "0.2", optional = true }
# Telemetry transport. Feature set mirrors tauri-plugin-updater's so the
# dependency graph does not grow — both are already resolved in Cargo.lock.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# OS keychain. Without a backend feature, keyring 3 uses its in-memory mock
# and sign-in does not survive the process.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# A throwaway git index for deleting an online copy without touching the real index.
tempfile = "3"
# Already in the tree via the updater (zip) and plist (quick-xml). Deflate uses
# the flate2 backend those crates already compiled. No zopfli, no lzma.
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
# Already resolved through zip. PDF images are Flate RGB; no new compression stack.
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
quick-xml = "0.39.4"
# SVG pictures become PNG through the same image path. No system librsvg.
resvg = "0.45"
# Already in the lockfile through fontdb. PDF fallback fonts read glyph ids
# and widths from the shipped TTF files.
ttf-parser = "0.25"
# O_NOFOLLOW when Tutorial.md is replaced. Already in the lockfile.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"

[features]
# Embeds a W3C WebDriver server in the app for local E2E testing with
# `tauri-webdriver` + WebdriverIO. Never enable this for release builds.
e2e = ["dep:tauri-plugin-webdriver"]

[dev-dependencies]
regex-lite = "0.1"
minisign = "0.7"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
